<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartLight Controller Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --accent: #0078d7;
      --accent-hover: #005fa3;
      --text: #222;
      --sub: #666;
      --border: #e0e0e0;
      --shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 auto;
      font-size: 1.6rem;
      color: var(--accent);
      font-weight: 600;
      text-align: center;
      width: 100%;
    }

    #globalActions button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      margin-left: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #globalActions button:hover {
      background: var(--accent-hover);
    }

    #deviceGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1200px;
      margin: 30px 0;
    }

    .deviceCard {
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 20px;
      transition: all 0.15s ease;
      position: relative;
    }

    .deviceCard.offline { opacity: 0.6; }

    .deviceHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .statusDot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #bbb;
    }

    .statusDot.online { background: #4caf50; }
    .statusDot.offline { background: #d9534f; }

    /* ===== Light bulb visual indicator ===== */
    .lightBulb {
      width: 60px;
      height: 60px;
      margin: 15px auto 10px;
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
    }

    .lightBulb.on {
      background: radial-gradient(circle at 30% 30%, #fff9a8, #ffeb3b 60%, #fbc02d);
      box-shadow: 0 0 25px 6px rgba(255, 235, 59, 0.6);
      animation: glowPulse 2.5s infinite ease-in-out;
    }

    .lightBulb.off {
      background: radial-gradient(circle at 30% 30%, #ccc, #777 60%, #555);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 25px 6px rgba(255, 235, 59, 0.5); }
      50% { box-shadow: 0 0 35px 10px rgba(255, 235, 59, 0.9); }
    }

    .deviceBody {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--sub);
      line-height: 1.6;
    }

    input[type=range] {
      width: 120px;
      vertical-align: middle;
    }

    .actions button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 6px 9px;
      margin: 4px 3px 0 0;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .actions button:hover { background: var(--accent-hover); }

    #logFilters {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 10px 20px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    #logPanel {
      width: 90%;
      max-width: 1200px;
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 15px 20px;
      height: 220px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--sub);
    }

    #logPanel b { color: var(--accent); }

    /* ===== Responsive mobile optimization ===== */
    @media (max-width: 900px) {
      header {
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
      }

      #globalActions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      #globalActions button {
        flex: 1 1 auto;
        min-width: 100px;
        margin: 4px 6px;
      }

      #deviceGrid {
        grid-template-columns: 1fr;
        width: 95%;
      }

      .deviceCard {
        padding: 16px;
        border-radius: 10px;
      }

      .deviceHeader h2 {
        font-size: 1.1rem;
      }

      .deviceBody {
        font-size: 0.9rem;
      }

      input[type=range] {
        width: 100%;
        height: 24px;
      }

      .actions button {
        width: 30%;
        min-width: 80px;
        margin: 4px 4px;
      }

      #logFilters, #logPanel {
        width: 95%;
        font-size: 0.85rem;
      }

      #logPanel {
        height: 160px;
      }

      h1 {
        text-align: center;
        width: 100%;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>SmartLight Controller Dashboard</h1>
    <div id="globalActions">
      <button onclick="broadcast('always_on')">ALL ON</button>
      <button onclick="broadcast('always_off')">ALL OFF</button>
      <button onclick="broadcast('auto')">ALL AUTO</button>
    </div>
  </header>

  <main id="deviceGrid"></main>

  <div id="logFilters">
    <b>Log Filter:</b>
    <label><input type="checkbox" id="f_status" checked> Status</label>
    <label><input type="checkbox" id="f_event" checked> Event</label>
    <label><input type="checkbox" id="f_cmd" checked> Command</label>
  </div>

  <div id="logPanel">
    <b>Event Log:</b><br>
  </div>

  <script>
    const socket = io("http://" + window.location.hostname + ":5000", { transports: ["websocket"] });
    const deviceGrid = document.getElementById("deviceGrid");
    const logPanel = document.getElementById("logPanel");
    let devices = {};

    socket.on("connect", () => appendLog("Connected to SocketIO server", "status"));
    socket.on("disconnect", () => appendLog("Disconnected from SocketIO server", "status"));

    socket.on("update_status", data => {
      devices[data.device_id] = {
        ...data.data,
        last_update: Date.now(),
        online: true
      };
      renderDevices();
    });

    socket.on("new_event", ev => {
      appendLog(`[${ev.device_id}] ${JSON.stringify(ev.event)}`, "event");
    });

    function renderDevices() {
      deviceGrid.innerHTML = "";
      const now = Date.now();
      for (const [id, d] of Object.entries(devices)) {
        const since = ((now - d.last_update) / 1000).toFixed(0);
        const online = since < 20;
        const card = document.createElement("div");
        card.className = `deviceCard ${online ? '' : 'offline'}`;

        card.innerHTML = `
          <div class="deviceHeader">
            <h2>${id}</h2>
            <div class="statusDot ${online ? 'online' : 'offline'}"></div>
          </div>
          <div class="lightBulb ${d.light_on ? 'on' : 'off'}"></div>
          <div class="deviceBody">
            <div><b>Mode:</b> ${d.mode}</div>
            <div><b>Sound Thresh:</b>
              <input type="range" id="sound_${id}" min="100" max="800" step="10" value="${d.sound_thresh}">
              <span id="sound_val_${id}">${d.sound_thresh}</span>
            </div>
            <div><b>Motion Thresh:</b>
              <input type="range" id="motion_${id}" min="0.005" max="0.1" step="0.001" value="${d.motion_thresh.toFixed(3)}">
              <span id="motion_val_${id}">${d.motion_thresh.toFixed(3)}</span>
            </div>
            <div><b>Timeout:</b>
              <input type="range" id="timeout_${id}" min="30" max="300" step="10" value="${d.timeout || 120}">
              <span id="timeout_val_${id}">${d.timeout || 120}</span> s
            </div>
            <div><b>Last seen:</b> ${since}s ago</div>
          </div>
          <div class="actions">
            <button onclick="setMode('${id}','auto')">Auto</button>
            <button onclick="setMode('${id}','always_on')">On</button>
            <button onclick="setMode('${id}','always_off')">Off</button>
            <button onclick="saveParams('${id}')">Save</button>
          </div>
        `;
        deviceGrid.appendChild(card);

        card.querySelector(`#sound_${id}`).addEventListener("input", e => {
          document.getElementById(`sound_val_${id}`).textContent = e.target.value;
        });
        card.querySelector(`#motion_${id}`).addEventListener("input", e => {
          document.getElementById(`motion_val_${id}`).textContent = parseFloat(e.target.value).toFixed(3);
        });
        card.querySelector(`#timeout_${id}`).addEventListener("input", e => {
          document.getElementById(`timeout_val_${id}`).textContent = e.target.value;
        });
      }
    }

    function appendLog(msg, type="status") {
      const filters = {
        status: document.getElementById("f_status").checked,
        event: document.getElementById("f_event").checked,
        cmd: document.getElementById("f_cmd").checked
      };
      if (!filters[type]) return;

      const line = document.createElement("div");
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logPanel.appendChild(line);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    function setMode(id, mode) {
      fetch("/set_param", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device_id: id, payload: { mode } })
      });
      appendLog(`[CMD] ${id} -> mode=${mode}`, "cmd");
    }

    function saveParams(id) {
      const sound = parseInt(document.getElementById(`sound_${id}`).value);
      const motion = parseFloat(document.getElementById(`motion_${id}`).value);
      const timeout = parseInt(document.getElementById(`timeout_${id}`).value);
      const payload = { sound_thresh: sound, motion_thresh: motion, timeout };

      fetch("/set_param", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device_id: id, payload })
      });
      appendLog(`[CMD] ${id} -> sound=${sound}, motion=${motion.toFixed(3)}, timeout=${timeout}`, "cmd");
    }

    function broadcast(mode) {
      fetch("/broadcast", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode })
      });
      appendLog(`[CMD] broadcast -> ${mode}`, "cmd");
    }

    // 定时刷新心跳状态
    setInterval(renderDevices, 500);
  </script>
</body>
</html>
